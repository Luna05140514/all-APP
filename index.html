<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>網站捷徑</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="網站捷徑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: a single iPad-style home screen — icon grid on top, a docked "add" bar at the bottom. */
:root{
  --bg:#e9eef0; --bg2:#dfe7e6; --panel:#ffffff; --fg:#1d2a2e; --muted:#5f7074;
  --line:#cdd8d9; --accent:#1f6f6a; --accent-fg:#ffffff; --danger:#b3412e;
  --shadow:0 1px 2px rgba(20,40,44,.08),0 6px 18px rgba(20,40,44,.08);
  --f-display:"Huninn","Chiron GoRound TC","Yuanti TC","PingFang TC",system-ui,sans-serif;
  --f-body:"Huninn","Chiron GoRound TC","Yuanti TC","PingFang TC",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141b1d; --bg2:#1a2427; --panel:#1f2a2d; --fg:#e6eeee; --muted:#95a7aa;
  --line:#2f3e41; --accent:#5cb8ae; --accent-fg:#0f1a1b; --danger:#ec7d69;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b1d; --bg2:#1a2427; --panel:#1f2a2d; --fg:#e6eeee; --muted:#95a7aa;
  --line:#2f3e41; --accent:#5cb8ae; --accent-fg:#0f1a1b; --danger:#ec7d69;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

html,body{min-height:100%}
body{background:radial-gradient(120% 80% at 20% 0%,var(--bg2),var(--bg) 60%) fixed,var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:960px;margin:0 auto;padding-inline:20px;padding-block:28px calc(var(--dock-h,150px) + 24px);display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,34px);margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:8px 16px;cursor:pointer}
.btn:focus-visible,input:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:26px 14px}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--fg);min-width:0;width:100%;border-radius:18px}
.icon{width:76px;height:76px;border-radius:19px;display:grid;place-items:center;overflow:hidden;box-shadow:var(--shadow);background:var(--panel);transition:transform .12s ease}
.icon img{width:100%;height:100%;object-fit:cover}
.icon.fav img{width:62%;height:62%;object-fit:contain}
.mono{font-family:var(--f-display);font-weight:700;font-size:34px;color:#fff;width:100%;height:100%;display:grid;place-items:center;text-transform:uppercase}
.tile:active .icon{transform:scale(.93)}
.label{font-size:13.5px;line-height:1.3;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;word-break:break-word}
.editing .icon{animation:jiggle .3s ease-in-out infinite alternate}
@keyframes jiggle{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@media (prefers-reduced-motion:reduce){.editing .icon{animation:none}}
.x,.pic{position:absolute;top:-6px;width:28px;height:28px;border-radius:50%;border:2px solid var(--bg);display:grid;place-items:center;cursor:pointer;font-size:15px;line-height:1;padding:0}
.x{left:calc(50% - 50px);background:var(--danger);color:#fff}
.pic{right:calc(50% - 50px);background:var(--accent);color:var(--accent-fg)}

.group{display:flex;flex-direction:column;gap:16px}
.group-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-size:19px;margin:0;font-weight:700}
.note{font-family:var(--f-body);font-size:12.5px;font-weight:400;color:var(--muted);margin-left:6px;letter-spacing:.04em}
.mono svg{display:block;width:100%;height:100%}
.empty{border:2px dashed var(--line);border-radius:20px;padding:36px 20px;text-align:center;color:var(--muted);line-height:1.7}
.empty strong{color:var(--fg);font-family:var(--f-display);font-size:20px;display:block;margin-bottom:4px}

.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.dock form{max-width:960px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap}
.dock input{flex:1 1 200px;min-width:0;font:inherit;font-size:17px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.dock input#name{flex:0 1 180px}
@media (max-width:600px){
  .dock{padding-top:10px}
  .dock form{gap:8px}
  .dock input{font-size:16px;padding:10px 12px}
  .dock input#url{flex:1 1 100%}
  .dock input#name{flex:1 1 0}
  .dock button{padding:10px 18px}
}
.dock button{font:inherit;font-size:17px;font-weight:700;padding:12px 22px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.dock button:disabled{opacity:.5}
.msg{max-width:960px;margin:6px auto 0;font-size:13px;color:var(--muted);min-height:1em}
.msg.err{color:var(--danger)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>網站捷徑</h1>
      <div class="sub">點圖示就會開啟網站</div>
    </div>
  </header>

  <section class="group" aria-label="網站">
    <div id="shared" class="grid"></div>
  </section>

  <section class="group" id="mine" hidden aria-labelledby="h-mine">
    <div class="group-head">
      <h2 id="h-mine">我加的網站 <span class="note">只存在這台裝置</span></h2>
      <button class="btn" id="editBtn" type="button" aria-pressed="false">編輯</button>
    </div>
    <div id="grid" class="grid"></div>
  </section>
</div>

<div class="dock">
  <form id="addForm" autocomplete="off">
    <input id="url" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="輸入網址，例如 youtube.com" aria-label="網址" required>
    <input id="name" type="text" placeholder="名稱（可不填）" aria-label="名稱">
    <button id="addBtn" type="submit">加入</button>
  </form>
  <div class="msg" id="msg" role="status"></div>
</div>
<input id="picker" type="file" accept="image/*" hidden>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const grid=$('#grid'), shared=$('#shared'), mine=$('#mine'), msg=$('#msg'), editBtn=$('#editBtn'), picker=$('#picker');

  // ── 大家都看得到的網站：要新增就在這裡加一行 ──
  const SITES=[
    {url:'https://draw.narwhallab.workers.dev/', name:'小畫家', color:'#d9573b',
     svg:'<circle cx="30" cy="32" r="20" fill="#fff"/><circle cx="22" cy="25" r="4" fill="#e8b33a"/><circle cx="33" cy="21" r="4" fill="#3b82c4"/><circle cx="41" cy="30" r="4" fill="#3aa36b"/><circle cx="24" cy="38" r="5" fill="#d9573b"/><path d="M50 12 L36 40" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M36 40 l-4 8 7-5z" fill="#3a2a22"/>'},
    {url:'https://girl-show.narwhallab.workers.dev/', name:'娃娃換裝', color:'#c9538a',
     svg:'<path d="M26 10 h12 l-2 8 8 6 -6 6 v-4 l-1 0 L46 52 H18 L27 26 h-1 v4 l-6 -6 8 -6z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="32" cy="36" r="2.4" fill="#c9538a"/><circle cx="26" cy="44" r="2.4" fill="#c9538a"/><circle cx="38" cy="44" r="2.4" fill="#c9538a"/>'},
    {url:'https://english-test.narwhallab.workers.dev/', name:'英文單字聽寫考試', color:'#3566a8',
     svg:'<path d="M14 36 v-4 a18 18 0 0 1 36 0 v4" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><rect x="10" y="34" width="10" height="16" rx="4" fill="#fff"/><rect x="44" y="34" width="10" height="16" rx="4" fill="#fff"/><text x="32" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="10.5" fill="#fff">ABC</text>'},
    {url:'https://english-speak.narwhallab.workers.dev/', name:'跟著唸英文課文', color:'#2f8a63',
     svg:'<rect x="24" y="10" width="16" height="28" rx="8" fill="#fff"/><path d="M16 30 a16 16 0 0 0 32 0" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><path d="M32 46 v8 M24 54 h16" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>'},
    {url:'https://pet-salon.narwhallab.workers.dev/', name:'寵物 SPA沙龍', color:'#8a5bb8',
     svg:'<ellipse cx="32" cy="42" rx="12" ry="10" fill="#fff"/><ellipse cx="18" cy="30" rx="5" ry="6.5" fill="#fff"/><ellipse cx="46" cy="30" rx="5" ry="6.5" fill="#fff"/><ellipse cx="25" cy="18" rx="5" ry="6.5" fill="#fff"/><ellipse cx="39" cy="18" rx="5" ry="6.5" fill="#fff"/><circle cx="50" cy="12" r="3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="55" cy="20" r="2" fill="none" stroke="#fff" stroke-width="1.8"/>'},
    {url:'https://cooking.narwhallab.workers.dev/', name:'料理廚房', color:'#e08a2c',
     svg:'<path d="M20 30 a8 8 0 0 1 4-15 a9 9 0 0 1 16 0 a8 8 0 0 1 4 15 v8 H20z" fill="#fff"/><rect x="20" y="40" width="24" height="5" rx="1.5" fill="#fff"/><path d="M14 48 h36 v4 a6 6 0 0 1-6 6 H20 a6 6 0 0 1-6-6z" fill="#fff" opacity=".85"/>'},
    {url:'https://test-vocabulary.narwhallab.workers.dev/', name:'英文單字測驗', color:'#22808f',
     svg:'<path d="M32 20 C26 15 18 14 10 15 V48 C18 47 26 48 32 53 C38 48 46 47 54 48 V15 C46 14 38 15 32 20z" fill="#fff"/><path d="M32 20 V53" stroke="#22808f" stroke-width="2"/><path d="M38 34 l5 5 9-12" fill="none" stroke="#e8b33a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="21" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#22808f">A</text>'},
    {url:'https://scl.narwhallab.workers.dev/', name:'SCL', color:'#4a5a8c',
     svg:'<rect x="10" y="18" width="44" height="28" rx="8" fill="#fff"/><text x="32" y="38.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#4a5a8c">SCL</text>'},
    {url:'https://eyes.narwhallab.workers.dev/', name:'眼睛', color:'#1f8fb3',
     svg:'<path d="M8 32 C16 19 48 19 56 32 C48 45 16 45 8 32z" fill="#fff"/><circle cx="32" cy="32" r="9" fill="#1f8fb3"/><circle cx="32" cy="32" r="4" fill="#123"/><circle cx="35" cy="29" r="2" fill="#fff"/>'},
    {url:'https://money.narwhallab.workers.dev/', name:'金錢', color:'#c99a1e',
     svg:'<circle cx="32" cy="32" r="20" fill="#fff"/><circle cx="32" cy="32" r="15" fill="none" stroke="#c99a1e" stroke-width="2.5"/><text x="32" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="#c99a1e">$</text>'},
    {url:'https://visual.narwhallab.workers.dev/', name:'視覺', color:'#39465e',
     svg:'<circle cx="23" cy="24" r="11" fill="#e8b33a"/><path d="M42 12 L54 33 H30z" fill="#e0603f"/><rect x="14" y="38" width="16" height="16" rx="3" fill="#5cb8ae"/><path d="M36 46 a10 10 0 1 0 20 0 a10 10 0 1 0 -20 0" fill="none" stroke="#fff" stroke-width="4"/>'},
  ];
  const KEY='shortcut-links-v1';
  let links=[], editing=false, picking=null;

  const PALETTE=['#1f6f6a','#3d5a98','#a4493d','#7a5c1e','#5b3f8c','#2e7d4f','#9a3b6a','#2f6690'];
  function hueFor(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
  function load(){try{links=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){links=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(links));return true}catch(e){say('儲存空間已滿，請刪掉一些自訂圖示',true);return false}}

  function normalize(raw){
    let s=raw.trim(); if(!s) return null;
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s='https://'+s;
    try{const u=new URL(s); if(!/^https?:$/.test(u.protocol)||!u.hostname.includes('.')) return null; return u}catch(e){return null}
  }
  function niceName(u){const b=u.hostname.replace(/^www\./,'').split('.')[0];return b.charAt(0).toUpperCase()+b.slice(1)}
  function say(t,err){msg.textContent=t||'';msg.classList.toggle('err',!!err)}
  function faviconUrl(host){return 'https://www.google.com/s2/favicons?sz=128&domain='+encodeURIComponent(host)}

  function mono(l){
    const m=document.createElement('div'); m.className='mono';
    m.style.background=hueFor(l.host||l.url);
    m.textContent=(l.name||l.host||'?').trim().charAt(0);
    return m;
  }

  function svgIcon(site){
    const d=document.createElement('div'); d.className='mono';
    d.style.background=site.color;
    d.innerHTML='<svg viewBox="0 0 64 64" width="100%" height="100%" aria-hidden="true">'+site.svg+'</svg>';
    return d;
  }
  // Try the site's own icon first, then Google's icon service, then our drawn fallback
  function iconFor(l,fallback){
    const ic=document.createElement('div'); ic.className='icon';
    const srcs=l.icon?[l.icon]:[l.origin+'/favicon.ico',faviconUrl(l.host)];
    const img=document.createElement('img'); img.alt='';
    let i=0;
    const next=()=>{ if(i<srcs.length){ if(!l.icon) ic.classList.add('fav'); img.src=srcs[i++]; } else { img.remove(); ic.classList.remove('fav'); ic.appendChild(fallback()); } };
    img.onerror=next;
    img.onload=()=>{ if(!l.icon && img.naturalWidth<=16) next(); };
    ic.appendChild(img); next();
    return ic;
  }
  function tile(l,fallback){
    const a=document.createElement('a'); a.className='tile'; a.href=l.url; a.target='_blank'; a.rel='noopener'; a.title=l.url;
    const lb=document.createElement('div'); lb.className='label'; lb.textContent=l.name||l.url;
    a.append(iconFor(l,fallback),lb);
    a.addEventListener('click',e=>{if(editing)e.preventDefault()});
    return a;
  }
  function withOrigin(l){try{const u=new URL(l.url);return {...l,host:u.hostname,origin:u.origin}}catch(e){return l}}

  function render(){
    shared.textContent=''; grid.textContent='';
    SITES.map(withOrigin).forEach(site=>{
      const cell=document.createElement('div'); cell.className='cell';
      cell.appendChild(tile(site,()=>svgIcon(site)));
      shared.appendChild(cell);
    });
    mine.hidden=links.length===0;
    editBtn.hidden=links.length===0 && !editing;
    grid.classList.toggle('editing',editing);
    links.map(withOrigin).forEach((l,idx)=>{
      const orig=links[idx];
      const cell=document.createElement('div'); cell.className='cell';
      cell.appendChild(tile(l,()=>mono(l)));
      if(editing){
        const x=document.createElement('button'); x.className='x'; x.type='button'; x.textContent='✕'; x.setAttribute('aria-label','刪除 '+l.name);
        x.onclick=()=>{links=links.filter(o=>o!==orig);if(!links.length)toggleEdit(false);save();render();say('已刪除 '+l.name)};
        const p=document.createElement('button'); p.className='pic'; p.type='button'; p.textContent='✎'; p.setAttribute('aria-label','更換圖示');
        p.onclick=()=>{picking=orig;picker.value='';picker.click()};
        cell.append(x,p);
      }
      grid.appendChild(cell);
    });
  }

  $('#addForm').addEventListener('submit',e=>{
    e.preventDefault();
    const u=normalize($('#url').value);
    if(!u){say('這個網址看起來不完整，請輸入像 youtube.com 這樣的網址',true);return}
    if(links.some(l=>l.url===u.href)||SITES.some(l=>l.url===u.href)){say('這個網站已經在裡面了',true);return}
    const name=$('#name').value.trim()||niceName(u);
    links.push({url:u.href,host:u.hostname,name,icon:null,createdAt:Date.now()});
    if(save()){$('#url').value='';$('#name').value='';say('已加入「'+name+'」')}
    render();
  });

  function toggleEdit(v){editing=v;editBtn.textContent=editing?'完成':'編輯';editBtn.classList.toggle('on',editing);editBtn.setAttribute('aria-pressed',editing)}
  editBtn.onclick=()=>{toggleEdit(!editing);render()};

  // Custom icon: shrink to 160px and keep as a data URL
  picker.addEventListener('change',()=>{
    const f=picker.files&&picker.files[0]; const l=picking; picking=null;
    if(!f||!l) return;
    const img=new Image(); const url=URL.createObjectURL(f);
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=c.height=160;
      const s=Math.min(img.width,img.height);
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160);
      URL.revokeObjectURL(url);
      l.icon=c.toDataURL('image/png'); if(save()) say('已更換「'+l.name+'」的圖示'); render();
    };
    img.onerror=()=>say('這個檔案無法當成圖示，請換一張圖片',true);
    img.src=url;
  });

  // Keep page content clear of the bottom bar, whatever height it ends up
  const dock=document.querySelector('.dock');
  const fit=()=>document.documentElement.style.setProperty('--dock-h',dock.offsetHeight+'px');
  fit(); window.addEventListener('resize',fit);
  if(window.ResizeObserver) new ResizeObserver(fit).observe(dock);
  load(); render();
})();
</script>
</body>
</html>
