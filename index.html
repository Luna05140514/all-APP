<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
/* Layout: pastel gradient sky with drifting stars and clouds; one frosted white card per category; a floating pill-shaped add bar. */
:root{
  --bg-a:#fdf0e2; --bg-b:#fbe6e8; --bg-c:#e2edf8; --bg-d:#f9dcdc;
  --card:rgba(255,255,255,.78); --card-line:rgba(238,176,150,.55);
  --fg:#22294a; --muted:#7a7f98; --line:#ead9d2; --field:#fbf6f3;
  --go:#3fb5b9; --go-2:#79cfd0; --on-go:#ffffff; --danger:#e0573f; --mine:#9b7be0;
  --h-game:#e2603a; --h-learn:#2f9467; --h-eye:#3a7fc4; --h-other:#8d6bd6;
  --deco-1:#b7a6ee; --deco-2:#8ec3ea; --deco-3:#f6b9a0; --cloud:#ffffff;
  --card-shadow:0 2px 4px rgba(150,110,100,.06),0 12px 30px rgba(150,110,100,.10);
  --f-display:"Huninn","Chiron GoRound TC","Yuanti TC","PingFang TC",system-ui,sans-serif;
  --f-body:"Huninn","Chiron GoRound TC","Yuanti TC","PingFang TC",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg-a:#251c38; --bg-b:#2c1f33; --bg-c:#16263f; --bg-d:#311d2c;
  --card:rgba(32,30,56,.78); --card-line:rgba(190,140,170,.35);
  --fg:#f1ecfa; --muted:#a9a3c2; --line:#3b3556; --field:#2a2745;
  --go:#3fb5b9; --go-2:#5fc6c7; --on-go:#0f1f24; --danger:#f0826d; --mine:#b59bf0;
  --h-game:#ff9a72; --h-learn:#6fd3a0; --h-eye:#7ab8f0; --h-other:#b7a0f4;
  --deco-1:#7d6bc4; --deco-2:#4f86b8; --deco-3:#c4806a; --cloud:rgba(255,255,255,.12);
  --card-shadow:0 2px 4px rgba(0,0,0,.25),0 12px 30px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg-a:#251c38; --bg-b:#2c1f33; --bg-c:#16263f; --bg-d:#311d2c;
  --card:rgba(32,30,56,.78); --card-line:rgba(190,140,170,.35);
  --fg:#f1ecfa; --muted:#a9a3c2; --line:#3b3556; --field:#2a2745;
  --go:#3fb5b9; --go-2:#5fc6c7; --on-go:#0f1f24; --danger:#f0826d; --mine:#b59bf0;
  --h-game:#ff9a72; --h-learn:#6fd3a0; --h-eye:#7ab8f0; --h-other:#b7a0f4;
  --deco-1:#7d6bc4; --deco-2:#4f86b8; --deco-3:#c4806a; --cloud:rgba(255,255,255,.12);
  --card-shadow:0 2px 4px rgba(0,0,0,.25),0 12px 30px rgba(0,0,0,.3); color-scheme:dark}

html,body{min-height:100%}
body{
  color:var(--fg);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent;
  background:var(--bg-a);
}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  background:
    radial-gradient(60% 50% at 0% 100%, var(--bg-d), transparent 70%),
    radial-gradient(55% 60% at 100% 10%, var(--bg-c), transparent 70%),
    linear-gradient(120deg, var(--bg-a) 0%, var(--bg-b) 50%, var(--bg-c) 100%)}
.deco svg{position:absolute}
.star4{fill:var(--deco-1)} .star5{fill:var(--deco-2)} .spark{fill:var(--deco-3)} .cloud{fill:var(--cloud)} .dot{fill:var(--deco-1);opacity:.6}
@media (prefers-reduced-motion:no-preference){.deco .tw{animation:tw 3.6s ease-in-out infinite alternate}.deco .tw2{animation:tw 4.4s ease-in-out infinite alternate-reverse}}
@keyframes tw{from{opacity:.45;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 28px) calc(var(--dock-h,150px) + 28px);display:flex;flex-direction:column;gap:18px}

.group{--h:var(--fg);background:var(--card);border:1.5px solid var(--card-line);border-radius:28px;box-shadow:var(--card-shadow);padding:18px 18px 22px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.g-game{--h:var(--h-game)} .g-learn{--h:var(--h-learn)} .g-eye{--h:var(--h-eye)} .g-other{--h:var(--h-other)} #mine{--h:var(--mine)}
.group-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-inline:6px}
h2{font-family:var(--f-display);font-size:25px;margin:0;font-weight:400;color:var(--h);display:flex;align-items:center;gap:8px;letter-spacing:.06em}
.h-ico{width:30px;height:30px;flex:none}
.h-ico *{fill:none;stroke:var(--h);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.h-ico .fill{fill:color-mix(in srgb,var(--h) 22%,transparent)}
.note{font-family:var(--f-body);font-size:12.5px;color:var(--muted);letter-spacing:.02em}

.btn{font:inherit;font-size:15px;border:1.5px solid var(--card-line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 16px;cursor:pointer}
.btn:focus-visible,input:focus-visible,.tile:focus-visible,.dock button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.btn.on{background:var(--mine);color:#fff;border-color:var(--mine)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:20px 8px}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--fg);min-width:0;width:100%;border-radius:20px;padding-block:6px 2px}
.icon{--glow:#999;position:relative;width:78px;height:78px;border-radius:24px;display:grid;place-items:center;overflow:hidden;background:#fff;
  box-shadow:0 10px 18px -6px color-mix(in srgb,var(--glow) 65%,transparent),0 2px 4px rgba(0,0,0,.08),inset 0 -4px 0 rgba(0,0,0,.08);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.icon::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(170deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.12) 38%,rgba(255,255,255,0) 55%,rgba(0,0,0,.06) 100%)}
.icon img{width:100%;height:100%;object-fit:cover}
.icon.fav img{width:62%;height:62%;object-fit:contain}
.mono{font-family:var(--f-display);font-weight:700;font-size:34px;color:#fff;width:100%;height:100%;display:grid;place-items:center;text-transform:uppercase}
.mono svg{display:block;width:100%;height:100%;text-transform:none}
@media (hover:hover){.tile:hover .icon{transform:translateY(-4px) scale(1.04)}}
.tile:active .icon{transform:scale(.92)}
.label{font-size:15px;line-height:1.3;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;word-break:break-word;padding-inline:2px;letter-spacing:.03em}
.editing .icon{animation:jiggle .3s ease-in-out infinite alternate}
@keyframes jiggle{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@media (prefers-reduced-motion:reduce){.editing .icon{animation:none}.icon{transition:none}}
.x,.pic{position:absolute;top:-2px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;cursor:pointer;font-size:15px;line-height:1;padding:0;z-index:2}
.x{left:calc(50% - 50px);background:var(--danger);color:#fff}
.pic{right:calc(50% - 50px);background:var(--mine);color:#fff}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock-in{pointer-events:auto;max-width:760px;margin:0 auto;background:var(--card);border:1.5px solid var(--card-line);border-radius:999px;box-shadow:var(--card-shadow);padding:8px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.dock form{display:flex;gap:8px;flex-wrap:wrap}
.dock input{flex:1 1 200px;min-width:0;font:inherit;font-size:17px;padding:11px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--field);color:var(--fg)}
.dock input::placeholder{color:var(--muted)}
.dock input#name{flex:0 1 190px}
.dock button{font:inherit;font-size:17px;padding:11px 26px;border-radius:999px;border:0;background:linear-gradient(180deg,var(--go-2),var(--go));color:var(--on-go);cursor:pointer;letter-spacing:.12em;box-shadow:0 6px 14px -6px var(--go)}
.dock button:disabled{opacity:.5}
.msg{max-width:760px;margin:6px auto 0;font-size:13px;color:var(--muted);text-align:center;min-height:0}
.msg:empty{display:none}
.msg.err{color:var(--danger)}
@media (max-width:600px){
  .wrap{gap:14px;padding-top:calc(env(safe-area-inset-top,0px) + 18px)}
  .group{padding:16px 10px 18px;border-radius:24px}
  h2{font-size:22px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 4px}
  .icon{width:72px;height:72px;border-radius:22px}
  .label{font-size:14px}
  .dock-in{border-radius:26px}
  .dock input{font-size:16px;padding:10px 14px}
  .dock input#url{flex:1 1 100%}
  .dock input#name{flex:1 1 0}
  .dock button{padding:10px 20px}
}
</style>
</head>

</div>

  <section class="group g-game" aria-labelledby="h-game">

    {group:'learn', url:'https://zhuyin.narwhallab.workers.dev/', name:'注音練習', color:'#e07a2e',
     svg:'<rect x="10" y="12" width="44" height="40" rx="6" fill="#fff"/><text x="23" y="41" text-anchor="middle" font-family="PingFang TC,Noto Sans TC,sans-serif" font-weight="700" font-size="20" fill="#e07a2e">ㄅ</text><text x="41" y="34" text-anchor="middle" font-family="PingFang TC,Noto Sans TC,sans-serif" font-weight="700" font-size="13" fill="#3d8b37">ㄆ</text><text x="41" y="47" text-anchor="middle" font-family="PingFang TC,Noto Sans TC,sans-serif" font-weight="700" font-size="11" fill="#3b82c4">ㄇ</text>'},
  ];
  const KEY='shortcut-links-v1';
  let links=[], editing=false, picking=null;

  const PALETTE=['#1f6f6a','#3d5a98','#a4493d','#7a5c1e','#5b3f8c','#2e7d4f','#9a3b6a','#2f6690'];
  function hueFor(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
  function load(){try{links=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){links=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(links));return true}catch(e){say('儲存空間已滿，請刪掉一些自訂圖示',true);return false}}

  function normalize(raw){
    let s=raw.trim(); if(!s) return null;
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s='https://'+s;
    try{const u=new URL(s); if(!/^https?:$/.test(u.protocol)||!u.hostname.includes('.')) return null; return u}catch(e){return null}
  }
  function niceName(u){const b=u.hostname.replace(/^www\./,'').split('.')[0];return b.charAt(0).toUpperCase()+b.slice(1)}
  function say(t,err){msg.textContent=t||'';msg.classList.toggle('err',!!err)}
  function faviconUrl(host){return 'https://www.google.com/s2/favicons?sz=128&domain='+encodeURIComponent(host)}

  function mono(l){
    const m=document.createElement('div'); m.className='mono';
    m.style.background=hueFor(l.host||l.url);
    m.textContent=(l.name||l.host||'?').trim().charAt(0);
    return m;
  }

  function svgIcon(site){
    const d=document.createElement('div'); d.className='mono';
    d.style.background=site.color;
    d.innerHTML='<svg viewBox="0 0 64 64" width="100%" height="100%" aria-hidden="true">'+site.svg+'</svg>';
    return d;
  }
  // Try the site's own icon first, then Google's icon service, then our drawn fallback
  function iconFor(l,fallback){
    const ic=document.createElement('div'); ic.className='icon';
    ic.style.setProperty('--glow', l.color || hueFor(l.host||l.url));
    const srcs=l.icon?[l.icon]:[l.origin+'/favicon.ico',faviconUrl(l.host)];
    const img=document.createElement('img'); img.alt='';
    let i=0;
    const next=()=>{ if(i<srcs.length){ if(!l.icon) ic.classList.add('fav'); img.src=srcs[i++]; } else { img.remove(); ic.classList.remove('fav'); ic.appendChild(fallback()); } };
    img.onerror=next;
    img.onload=()=>{ if(!l.icon && img.naturalWidth<=16) next(); };
    ic.appendChild(img); next();
    return ic;
  }
  function tile(l,fallback){
    const a=document.createElement('a'); a.className='tile'; a.href=l.url; a.target='_blank'; a.rel='noopener'; a.title=l.url;
    const lb=document.createElement('div'); lb.className='label'; lb.textContent=l.name||l.url;
    a.append(iconFor(l,fallback),lb);
    a.addEventListener('click',e=>{if(editing)e.preventDefault()});
    return a;
  }
  function withOrigin(l){try{const u=new URL(l.url);return {...l,host:u.hostname,origin:u.origin}}catch(e){return l}}

  function render(){
    Object.values(groupEls).forEach(e=>e.textContent=''); others.textContent=''; grid.textContent='';
    // 每一類裡的排列順序
    const ORDER=['draw','girl-show','pet-salon','cooking','ring','car-racing','number-memory','labyrinth','fish-game','eyes','scl','visual','price-list','english-test','english-speak','test-vocabulary','eschool-grammar','money','faker','zhuyin'];
    const rank=site=>{const i=ORDER.indexOf(site.host.split('.')[0]);return i<0?999:i};
    SITES.map(withOrigin).map((x,i)=>[x,i]).sort((a,b)=>((a[0].other?1000+a[1]:rank(a[0]))-(b[0].other?1000+b[1]:rank(b[0])))||a[1]-b[1]).map(x=>x[0]).forEach(site=>{
      const cell=document.createElement('div'); cell.className='cell';
      cell.appendChild(tile(site,()=>svgIcon(site)));
      (site.other?others:(groupEls[site.group]||others)).appendChild(cell);
    });
    mine.hidden=links.length===0;
    editBtn.hidden=links.length===0 && !editing;
    grid.classList.toggle('editing',editing);
    links.map(withOrigin).forEach((l,idx)=>{
      const orig=links[idx];
      const cell=document.createElement('div'); cell.className='cell';
      cell.appendChild(tile(l,()=>mono(l)));
      if(editing){
        const x=document.createElement('button'); x.className='x'; x.type='button'; x.textContent='✕'; x.setAttribute('aria-label','刪除 '+l.name);
        x.onclick=()=>{links=links.filter(o=>o!==orig);if(!links.length)toggleEdit(false);save();render();say('已刪除 '+l.name)};
        const p=document.createElement('button'); p.className='pic'; p.type='button'; p.textContent='✎'; p.setAttribute('aria-label','更換圖示');
        p.onclick=()=>{picking=orig;picker.value='';picker.click()};
        cell.append(x,p);
      }
      grid.appendChild(cell);
    });
  }

  $('#addForm').addEventListener('submit',e=>{
    e.preventDefault();
    const u=normalize($('#url').value);
    if(!u){say('這個網址看起來不完整，請輸入像 youtube.com 這樣的網址',true);return}
    if(links.some(l=>l.url===u.href)||SITES.some(l=>l.url===u.href)){say('這個網站已經在裡面了',true);return}
    const name=$('#name').value.trim()||niceName(u);
    links.push({url:u.href,host:u.hostname,name,icon:null,createdAt:Date.now()});
    if(save()){$('#url').value='';$('#name').value='';say('已加入「'+name+'」')}
    render();
  });

  function toggleEdit(v){editing=v;editBtn.textContent=editing?'完成':'編輯';editBtn.classList.toggle('on',editing);editBtn.setAttribute('aria-pressed',editing)}
  editBtn.onclick=()=>{toggleEdit(!editing);render()};

  // Custom icon: shrink to 160px and keep as a data URL
  picker.addEventListener('change',()=>{
    const f=picker.files&&picker.files[0]; const l=picking; picking=null;
    if(!f||!l) return;
    const img=new Image(); const url=URL.createObjectURL(f);
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=c.height=160;
      const s=Math.min(img.width,img.height);
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160);
      URL.revokeObjectURL(url);
      l.icon=c.toDataURL('image/png'); if(save()) say('已更換「'+l.name+'」的圖示'); render();
    };
    img.onerror=()=>say('這個檔案無法當成圖示，請換一張圖片',true);
    img.src=url;
  });

  // Keep page content clear of the bottom bar, whatever height it ends up
  const dock=document.querySelector('.dock');
  const fit=()=>document.documentElement.style.setProperty('--dock-h',dock.offsetHeight+'px');
  fit(); window.addEventListener('resize',fit);
  if(window.ResizeObserver) new ResizeObserver(fit).observe(dock);
  load(); render();
})();
</script>
